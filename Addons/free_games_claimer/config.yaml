name: Free Games Claimer (Restored)
version: "3.12"
slug: local_fgc_restored
description: "Fixed ASF claimer"
url: "https://github.com/alexbelgium"
startup: application
arch:
  - aarch64
  - amd64
  - armv7
map:
  - addon_config:rw
  - homeassistant_config:rw
options:
  env_vars: []
  CMD_ARGUMENTS: node epic-games ; node prime-gaming ; node gog
  CONFIG_LOCATION: /config/config.env
  EPIC_EMAIL: ""
  EPIC_PASSWORD: ""
  GOG_EMAIL: ""
  GOG_PASSWORD: ""
  PRIME_EMAIL: ""
  PRIME_PASSWORD: ""
  steam_username: ""
  steam_password: ""
ports:
  5900/tcp: null
  6080/tcp: 6080
ports_description:
  5900/tcp: VNC port
  6080/tcp: NOVNC port
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
  CMD_ARGUMENTS: str
  CONFIG_LOCATION: str
  EPIC_EMAIL: str?
  EPIC_PASSWORD: password?
  GOG_EMAIL: str?
  GOG_PASSWORD: password?
  PRIME_EMAIL: str?
  PRIME_PASSWORD: password?
  steam_username: str?
  steam_password: password?
