worker_processes 1;
daemon off;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;

        # Serve noVNC static files — match any path so ingress prefix works
        location / {
            root /usr/share/novnc;
            index vnc.html;
            try_files $uri $uri/ /vnc.html;
        }

        # Proxy WebSocket VNC — match any path ending in /websockify
        # (HA ingress prepends /api/hassio_ingress/<token>/ to all paths)
        location ~* /websockify$ {
            proxy_pass http://127.0.0.1:5901;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}
